# Nombre de la aplicación
spring.application.name=PuntoVenta
# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/PuntoVenta
spring.datasource.username=postgres
spring.datasource.password=mario
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Formato JSON y Zona Horaria
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/El_Salvador
# Puerto del Servidor
server.port=8081

# Configuración de Sesión y Cookies para React Frontend
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=120m